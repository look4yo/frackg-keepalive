name: backup-frackg-graph

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-frackg-graph
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade neo4j

      - name: Export the live graph to backups/
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          MIN_NODES: ${{ vars.MIN_NODES || '200' }}
        run: python scripts/export_backup.py

      - name: Commit the snapshot when the graph changed
        run: |
          set -euo pipefail
          if [ "$(cat backups/.changed 2>/dev/null || echo 1)" != "1" ]; then
            echo "graph unchanged since the last snapshot -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/FRAC_KG_latest.cypher
          if git diff --cached --quiet; then
            echo "file content identical -- nothing to commit"
            exit 0
          fi
          git commit -m "backup: graph snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
