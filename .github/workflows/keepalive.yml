name: keep-frackg-alive

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade neo4j requests

      - name: Keep Streamlit and Neo4j alive
        env:
          APP_URL: "https://frackg-s2ka2iaeutit6wnzar23x7.streamlit.app/"
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import requests
          from neo4j import GraphDatabase

          app_url = os.environ["APP_URL"]
          response = requests.get(app_url, timeout=60)
          print("Streamlit status:", response.status_code)
          response.raise_for_status()

          missing = [
              name
              for name in ("NEO4J_URI", "NEO4J_USER", "NEO4J_PASSWORD")
              if not os.environ.get(name)
          ]
          if missing:
              raise RuntimeError(f"Missing GitHub Actions secrets: {', '.join(missing)}")

          driver = GraphDatabase.driver(
              os.environ["NEO4J_URI"],
              auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"]),
          )

          try:
              with driver.session() as session:
                  ok = session.run("RETURN 1 AS ok").single()["ok"]
                  print("Neo4j status:", ok)
          finally:
              driver.close()
          PY
